<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DenteFácil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#2563eb;--blue-light:#eff6ff;
  --green:#16a34a;--green-light:#f0fdf4;
  --red:#dc2626;--red-light:#fef2f2;
  --yellow:#d97706;--yellow-light:#fffbeb;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;
  --g800:#1f2937;--g900:#111827;
  --sw:220px
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--g50);color:var(--g800);display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:#fff;border-right:1px solid var(--g200);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.logo{padding:18px 16px;border-bottom:1px solid var(--g200)}
.logo h1{font-size:18px;font-weight:700;color:var(--blue)}
.logo span{font-size:11px;color:var(--g400)}
.nav{padding:12px 8px;flex:1}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--g600);font-size:14px;font-weight:500;transition:.15s;margin-bottom:2px}
.ni:hover{background:var(--g50);color:var(--g900)}
.ni.active{background:var(--blue-light);color:var(--blue)}
.main{margin-left:var(--sw);flex:1;padding:24px;max-width:calc(100vw - var(--sw))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.pt{font-size:22px;font-weight:700;color:var(--g900)}
.card{background:#fff;border-radius:12px;border:1px solid var(--g200);padding:20px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.sc{background:#fff;border-radius:12px;border:1px solid var(--g200);padding:20px}
.sl{font-size:13px;color:var(--g500);margin-bottom:6px}
.sv{font-size:28px;font-weight:700;color:var(--g900)}
.ss{font-size:12px;color:var(--g400);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:.15s;font-family:inherit}
.bp{background:var(--blue);color:#fff}.bp:hover{background:#1d4ed8}
.bs{background:#fff;color:var(--g700);border:1px solid var(--g300)}.bs:hover{background:var(--g50)}
.bd{background:var(--red-light);color:var(--red)}.bd:hover{background:#fee2e2}
.bsm{padding:6px 12px;font-size:13px}
.si{flex:1;padding:10px 14px;border:1px solid var(--g200);border-radius:8px;font-size:14px;outline:none;background:#fff;font-family:inherit}
.si:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.sb{display:flex;gap:12px;margin-bottom:20px}
.pl{display:flex;flex-direction:column;gap:10px}
.pc{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.15s}
.pc:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.1)}
.av{width:44px;height:44px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.av2{width:60px;height:60px;font-size:22px}
.pi{flex:1}
.pn{font-weight:600;color:var(--g900);font-size:15px}
.pm{font-size:13px;color:var(--g500);margin-top:2px}
.pbg{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500}
.bg{background:var(--green-light);color:var(--green)}
.br{background:var(--red-light);color:var(--red)}
.by{background:var(--yellow-light);color:var(--yellow)}
.bb{background:var(--blue-light);color:var(--blue)}
.bgr{background:var(--g100);color:var(--g600)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.md{background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto}
.mh{padding:18px 24px;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;align-items:center}
.mt{font-size:17px;font-weight:600}
.mc{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g400);line-height:1}
.mb{padding:24px}
.mf{padding:14px 24px;border-top:1px solid var(--g200);display:flex;justify-content:flex-end;gap:10px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgr{display:flex;flex-direction:column;gap:5px}
.fgr.full{grid-column:1/-1}
label{font-size:13px;font-weight:500;color:var(--g700)}
input,select,textarea{padding:9px 12px;border:1px solid var(--g200);border-radius:8px;font-size:14px;outline:none;font-family:inherit;color:var(--g800);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:80px}
.tabs{display:flex;border-bottom:1px solid var(--g200);margin-bottom:20px}
.tab{padding:11px 18px;font-size:14px;font-weight:500;color:var(--g500);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tab:hover{color:var(--g800)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.dph{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:20px 24px;margin-bottom:24px;display:flex;gap:20px;align-items:center}
.ti{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--g50);border-radius:10px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ei{border-left:3px solid var(--blue);padding:14px 16px;background:#fff;border-radius:0 10px 10px 0;margin-bottom:12px;border:1px solid var(--g200);border-left:3px solid var(--blue)}
.ed{font-size:12px;color:var(--g400);margin-bottom:5px}
.ep{font-weight:600;font-size:14px;margin-bottom:5px}
.en{font-size:14px;color:var(--g600);white-space:pre-wrap}
.pyi{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--g100)}
.pyi:last-child{border-bottom:none}
.fsum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.fb{padding:16px;border-radius:10px;text-align:center}
.fbl{font-size:12px;margin-bottom:5px}
.fbv{font-size:22px;font-weight:700}
.tc{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--g900);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:si .2s ease}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:40px 24px;color:var(--g400)}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty p{font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--g500);font-size:14px;cursor:pointer;margin-bottom:14px}
.back:hover{color:var(--g800)}
.div{height:1px;background:var(--g100);margin:16px 0}
.ir{display:flex;gap:8px;margin-bottom:8px}
.ilb{font-size:13px;color:var(--g500);min-width:140px;flex-shrink:0}
.ivl{font-size:13px;color:var(--g800);font-weight:500}
.stl{font-size:15px;font-weight:600;color:var(--g700);margin-bottom:12px}
.pbw{height:6px;background:var(--g200);border-radius:999px;overflow:hidden;margin-top:12px;margin-bottom:20px}
.pbf{height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <h1>🦷 DenteFácil</h1>
    <span>Gestão de Pacientes</span>
  </div>
  <nav class="nav">
    <div class="ni active" data-page="dashboard" onclick="go('dashboard')">📊 Dashboard</div>
    <div class="ni" data-page="pacientes" onclick="go('pacientes')">👥 Pacientes</div>
  </nav>
</aside>

<main class="main" id="app"></main>
<div class="tc" id="toasts"></div>
<div id="modals"></div>

<script>
// ── DB ──────────────────────────────────────────────
const KEY = 'df_v1';
let DB = {patients:[],treatments:[],payments:[],evolutions:[]};
function load(){try{const s=localStorage.getItem(KEY);if(s)DB=JSON.parse(s);}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}

// ── ESCAPE ──────────────────────────────────────────
function h(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── TOAST ────────────────────────────────────────────
function toast(msg,type=''){
  const tc=document.getElementById('toasts');
  const el=document.createElement('div');el.className='toast';
  if(type==='err')el.style.background='#dc2626';
  if(type==='ok')el.style.background='#16a34a';
  el.textContent=msg;tc.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// ── NAV ──────────────────────────────────────────────
let page='dashboard', pid=null, tab='ficha', q='', filt=false;

function go(p,id=null){
  page=p;pid=id;tab='ficha';
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('active',n.dataset.page===(p==='patient'?'pacientes':p)));
  render();
}

function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.t===t));
  document.getElementById('tc').innerHTML=renderTab();
}

// ── RENDER ───────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML=
    page==='dashboard'?renderDash():
    page==='pacientes'?renderList():
    page==='patient'?renderDetail():'';}

// ── DASHBOARD ────────────────────────────────────────
function renderDash(){
  const total=DB.patients.length;
  const pend=DB.patients.filter(p=>bal(p.id).due>0).length;
  const ativo=DB.patients.filter(p=>DB.treatments.some(t=>t.pid===p.id&&t.status!=='concluido')).length;
  const rec=[...DB.patients].sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm)).slice(0,6);
  return `
  <div class="ph"><h1 class="pt">Dashboard</h1><button class="btn bp" onclick="openNP()">+ Novo Paciente</button></div>
  <div class="sgrid">
    <div class="sc"><div class="sl">Total de Pacientes</div><div class="sv">${total}</div></div>
    <div class="sc"><div class="sl">Pagamentos Pendentes</div><div class="sv" style="color:var(--red)">${pend}</div><div class="ss">pacientes com saldo em aberto</div></div>
    <div class="sc"><div class="sl">Em Tratamento</div><div class="sv" style="color:var(--blue)">${ativo}</div><div class="ss">tratamentos ativos</div></div>
  </div>
  <div class="card">
    <div class="stl">Pacientes Recentes</div>
    ${rec.length===0?`<div class="empty"><div class="ico">👤</div><p>Nenhum paciente ainda. Clique em "Novo Paciente" para começar.</p></div>`:rec.map(pCard).join('')}
  </div>`;
}

// ── LIST ─────────────────────────────────────────────
function renderList(){
  let pts=[...DB.patients];
  if(q){const lq=q.toLowerCase();pts=pts.filter(p=>p.nome.toLowerCase().includes(lq)||(p.telefone||'').includes(lq));}
  if(filt)pts=pts.filter(p=>bal(p.id).due>0);
  pts.sort((a,b)=>a.nome.localeCompare(b.nome));
  return `
  <div class="ph"><h1 class="pt">Pacientes</h1><button class="btn bp" onclick="openNP()">+ Novo Paciente</button></div>
  <div class="sb">
    <input class="si" placeholder="Buscar por nome ou telefone..." value="${h(q)}" oninput="q=this.value;render()">
    <button class="btn ${filt?'bp':'bs'}" onclick="filt=!filt;render()">💰 Só pendentes</button>
  </div>
  <div class="pl">
    ${pts.length===0?`<div class="empty"><div class="ico">🔍</div><p>${q?'Nenhum resultado.':'Nenhum paciente cadastrado.'}</p></div>`:pts.map(pCard).join('')}
  </div>`;
}

function pCard(p){
  const b=bal(p.id);
  const trs=DB.treatments.filter(t=>t.pid===p.id);
  const pend=trs.filter(t=>t.status!=='concluido').length;
  const last=DB.evolutions.filter(e=>e.pid===p.id).sort((a,b)=>b.data.localeCompare(a.data))[0];
  const ini=p.nome.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  return `<div class="pc" onclick="go('patient','${p.id}')">
    <div class="av">${ini}</div>
    <div class="pi">
      <div class="pn">${h(p.nome)}</div>
      <div class="pm">${p.telefone?h(p.telefone)+' · ':''}${last?'Última: '+fmtD(last.data):'Sem consultas'}</div>
    </div>
    <div class="pbg">
      ${b.due>0?`<span class="badge br">💰 ${fmtR(b.due)}</span>`:'<span class="badge bg">✓ Em dia</span>'}
      ${pend>0?`<span class="badge bb">${pend} proc.</span>`:''}
    </div>
  </div>`;
}

// ── DETAIL ───────────────────────────────────────────
function renderDetail(){
  const p=DB.patients.find(x=>x.id===pid);
  if(!p)return '<p>Não encontrado.</p>';
  const ini=p.nome.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  const b=bal(pid);
  const trs=DB.treatments.filter(t=>t.pid===pid);
  const done=trs.filter(t=>t.status==='concluido').length;
  return `
  <div class="back" onclick="go('pacientes')">← Voltar</div>
  <div class="dph">
    <div class="av av2">${ini}</div>
    <div style="flex:1">
      <div style="font-size:20px;font-weight:700;margin-bottom:3px">${h(p.nome)}</div>
      <div style="font-size:13px;color:var(--g500)">${p.telefone?`<a href="tel:${h(p.telefone)}" style="color:inherit">${h(p.telefone)}</a>`:''} ${p.dataNascimento?'· '+calcAge(p.dataNascimento)+' anos':''}</div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        ${b.due>0?`<span class="badge br">💰 Em aberto: ${fmtR(b.due)}</span>`:'<span class="badge bg">✓ Sem pendências</span>'}
        ${trs.length>0?`<span class="badge bb">${done}/${trs.length} procedimentos</span>`:''}
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button class="btn bs bsm" onclick="openEP('${pid}')">✏️ Editar</button>
      <button class="btn bd bsm" onclick="delPat('${pid}')">🗑️</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab ${tab==='ficha'?'active':''}" data-t="ficha" onclick="setTab('ficha')">📋 Ficha</div>
    <div class="tab ${tab==='tratamento'?'active':''}" data-t="tratamento" onclick="setTab('tratamento')">🦷 Tratamento</div>
    <div class="tab ${tab==='financeiro'?'active':''}" data-t="financeiro" onclick="setTab('financeiro')">💰 Financeiro</div>
    <div class="tab ${tab==='evolucoes'?'active':''}" data-t="evolucoes" onclick="setTab('evolucoes')">📝 Evoluções</div>
  </div>
  <div id="tc">${renderTab()}</div>`;
}

function renderTab(){
  if(tab==='ficha')return rFicha();
  if(tab==='tratamento')return rTrat();
  if(tab==='financeiro')return rFin();
  if(tab==='evolucoes')return rEvol();
  return '';
}

// ── FICHA ────────────────────────────────────────────
function rFicha(){
  const p=DB.patients.find(x=>x.id===pid);
  return `<div class="card">
    <div class="stl">Dados Pessoais</div>
    <div class="ir"><span class="ilb">Nome</span><span class="ivl">${h(p.nome)||'—'}</span></div>
    <div class="ir"><span class="ilb">Data de nascimento</span><span class="ivl">${p.dataNascimento?fmtD(p.dataNascimento):'—'}</span></div>
    <div class="ir"><span class="ilb">CPF</span><span class="ivl">${h(p.cpf)||'—'}</span></div>
    <div class="ir"><span class="ilb">Telefone</span><span class="ivl">${h(p.telefone)||'—'}</span></div>
    <div class="ir"><span class="ilb">E-mail</span><span class="ivl">${h(p.email)||'—'}</span></div>
    <div class="ir"><span class="ilb">Endereço</span><span class="ivl">${h(p.endereco)||'—'}</span></div>
    <div class="ir"><span class="ilb">Convênio</span><span class="ivl">${h(p.convenio)||'Particular'}</span></div>
    <div class="div"></div>
    <div class="stl">Histórico Médico</div>
    <div class="ir"><span class="ilb">Alergias</span><span class="ivl">${h(p.alergias)||'—'}</span></div>
    <div class="ir"><span class="ilb">Medicamentos</span><span class="ivl">${h(p.medicamentos)||'—'}</span></div>
    <div class="ir"><span class="ilb">Condições médicas</span><span class="ivl">${h(p.conds)||'—'}</span></div>
    <div class="ir"><span class="ilb">Queixa principal</span><span class="ivl">${h(p.queixa)||'—'}</span></div>
  </div>`;
}

// ── TRATAMENTO ────────────────────────────────────────
function rTrat(){
  const trs=DB.treatments.filter(t=>t.pid===pid).sort((a,b)=>a.criadoEm.localeCompare(b.criadoEm));
  const done=trs.filter(t=>t.status==='concluido').length;
  const total=trs.length;
  const pct=total?Math.round(done/total*100):0;
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div><div class="stl" style="margin-bottom:0">Plano de Tratamento</div>
    ${total?`<div style="font-size:13px;color:var(--g500);margin-top:3px">${done} de ${total} concluídos (${pct}%)</div>`:''}</div>
    <button class="btn bp bsm" onclick="openNT()">+ Adicionar</button>
  </div>
  ${total?`<div class="pbw"><div class="pbf" style="width:${pct}%"></div></div>`:''}
  ${trs.length===0?`<div class="empty"><div class="ico">🦷</div><p>Nenhum procedimento no plano.</p></div>`
  :trs.map(t=>`<div class="ti">
    <div class="dot" style="background:${t.status==='concluido'?'var(--green)':t.status==='em_andamento'?'var(--yellow)':'var(--g400)'}"></div>
    <div style="flex:1">
      <div style="font-weight:600;font-size:14px">${h(t.proc)}</div>
      <div style="font-size:12px;color:var(--g500)">${t.dente?'Dente '+h(t.dente)+' · ':''}${t.valor?fmtR(parseFloat(t.valor))+' · ':''}${h(t.obs)||''}</div>
    </div>
    <select style="border:1px solid var(--g200);border-radius:6px;font-size:12px;padding:4px 8px;cursor:pointer;background:#fff" onchange="updTreat('${t.id}',this.value)">
      <option value="pendente" ${t.status==='pendente'?'selected':''}>Pendente</option>
      <option value="em_andamento" ${t.status==='em_andamento'?'selected':''}>Em andamento</option>
      <option value="concluido" ${t.status==='concluido'?'selected':''}>Concluído ✓</option>
    </select>
    <button class="btn bd bsm" onclick="delTreat('${t.id}')">🗑️</button>
  </div>`).join('')}`;
}

// ── FINANCEIRO ────────────────────────────────────────
function rFin(){
  const pys=DB.payments.filter(p=>p.pid===pid).sort((a,b)=>b.data.localeCompare(a.data));
  const b=bal(pid);
  return `
  <div class="fsum">
    <div class="fb" style="background:var(--blue-light)"><div class="fbl" style="color:var(--blue)">Total do Tratamento</div><div class="fbv" style="color:var(--blue)">${fmtR(b.total)}</div></div>
    <div class="fb" style="background:var(--green-light)"><div class="fbl" style="color:var(--green)">Pago</div><div class="fbv" style="color:var(--green)">${fmtR(b.paid)}</div></div>
    <div class="fb" style="background:${b.due>0?'var(--red-light)':'var(--g100)'}"><div class="fbl" style="color:${b.due>0?'var(--red)':'var(--g500)'}">Em Aberto</div><div class="fbv" style="color:${b.due>0?'var(--red)':'var(--g500)'}">${fmtR(b.due)}</div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="stl" style="margin-bottom:0">Histórico de Pagamentos</div>
    <button class="btn bp bsm" onclick="openNPy()">+ Registrar Pagamento</button>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    ${pys.length===0?`<div class="empty"><div class="ico">💳</div><p>Nenhum pagamento registrado.</p></div>`
    :pys.map(p=>`<div class="pyi">
      <div><div style="font-weight:600;font-size:14px">${h(p.desc)}</div><div style="font-size:12px;color:var(--g500)">${fmtD(p.data)} · ${fmtFP(p.forma)}</div></div>
      <div style="display:flex;align-items:center;gap:10px"><div style="font-weight:700;color:var(--green);font-size:16px">${fmtR(parseFloat(p.valor))}</div>
      <button class="btn bd bsm" onclick="delPay('${p.id}')">🗑️</button></div>
    </div>`).join('')}
  </div>`;
}

// ── EVOLUÇÕES ─────────────────────────────────────────
function rEvol(){
  const evs=DB.evolutions.filter(e=>e.pid===pid).sort((a,b)=>b.data.localeCompare(a.data));
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="stl" style="margin-bottom:0">Evoluções por Consulta</div>
    <button class="btn bp bsm" onclick="openNE()">+ Nova Evolução</button>
  </div>
  ${evs.length===0?`<div class="empty"><div class="ico">📝</div><p>Nenhuma evolução registrada.</p></div>`
  :evs.map(e=>`<div class="ei">
    <div class="ed">${fmtD(e.data)}${e.hora?' · '+e.hora:''}</div>
    <div class="ep">${h(e.proc)}</div>
    ${e.notas?`<div class="en">${h(e.notas)}</div>`:''}
    ${e.prox?`<div style="margin-top:8px;font-size:12px;color:var(--blue)">📅 Próxima: ${fmtD(e.prox)}</div>`:''}
    <div style="margin-top:10px"><button class="btn bd bsm" onclick="delEvol('${e.id}')">🗑️ Excluir</button></div>
  </div>`).join('')}`;
}

// ── HELPERS ───────────────────────────────────────────
function bal(id){
  const tot=DB.treatments.filter(t=>t.pid===id).reduce((s,t)=>s+(parseFloat(t.valor)||0),0);
  const paid=DB.payments.filter(p=>p.pid===id).reduce((s,p)=>s+(parseFloat(p.valor)||0),0);
  return{total:tot,paid,due:Math.max(0,tot-paid)};
}
function fmtR(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);}
function fmtD(d){if(!d)return'—';const[y,m,dy]=d.split('-');return`${dy}/${m}/${y}`;}
function calcAge(d){const t=new Date(),b=new Date(d);let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a;}
function fmtFP(f){return{dinheiro:'Dinheiro',pix:'PIX',cartao_credito:'Cartão Crédito',cartao_debito:'Cartão Débito',convenio:'Convênio',cheque:'Cheque'}[f]||f;}
function today(){return new Date().toISOString().split('T')[0];}

// ── MODAL UTIL ────────────────────────────────────────
function openM(title,body,saveFn,lbl='Salvar'){
  document.getElementById('modals').innerHTML=`
  <div class="mo" onclick="if(event.target.classList.contains('mo'))closeM()">
    <div class="md">
      <div class="mh"><div class="mt">${title}</div><button class="mc" onclick="closeM()">✕</button></div>
      <div class="mb">${body}</div>
      <div class="mf"><button class="btn bs" onclick="closeM()">Cancelar</button><button class="btn bp" onclick="${saveFn}">${lbl}</button></div>
    </div>
  </div>`;}
function closeM(){document.getElementById('modals').innerHTML='';}

// ── PATIENT MODAL ─────────────────────────────────────
function patForm(p={}){return `
  <div class="fg">
    <div class="fgr full"><label>Nome completo *</label><input id="fn" value="${h(p.nome||'')}"></div>
    <div class="fgr"><label>Data de Nascimento</label><input id="fd" type="date" value="${h(p.dataNascimento||'')}"></div>
    <div class="fgr"><label>CPF</label><input id="fc" value="${h(p.cpf||'')}" placeholder="000.000.000-00"></div>
    <div class="fgr"><label>Telefone</label><input id="ft" value="${h(p.telefone||'')}" placeholder="(11) 99999-9999"></div>
    <div class="fgr"><label>E-mail</label><input id="fe" type="email" value="${h(p.email||'')}"></div>
    <div class="fgr full"><label>Endereço</label><input id="fend" value="${h(p.endereco||'')}"></div>
    <div class="fgr"><label>Convênio</label><input id="fconv" value="${h(p.convenio||'')}" placeholder="Particular ou nome do convênio"></div>
  </div>
  <div class="div"></div>
  <div class="stl">Histórico Médico</div>
  <div class="fg">
    <div class="fgr full"><label>Alergias</label><input id="falg" value="${h(p.alergias||'')}" placeholder="Anestésico, penicilina..."></div>
    <div class="fgr full"><label>Medicamentos em uso</label><input id="fmed" value="${h(p.medicamentos||'')}"></div>
    <div class="fgr full"><label>Condições médicas</label><textarea id="fconds">${h(p.conds||'')}</textarea></div>
    <div class="fgr full"><label>Queixa principal</label><input id="fq" value="${h(p.queixa||'')}"></div>
  </div>`;}

function openNP(){openM('Novo Paciente',patForm(),'saveNP()');}
function openEP(id){openM('Editar Paciente',patForm(DB.patients.find(x=>x.id===id)),`saveEP('${id}')`);}

function readForm(){return{
  nome:document.getElementById('fn').value.trim(),
  dataNascimento:document.getElementById('fd').value,
  cpf:document.getElementById('fc').value,
  telefone:document.getElementById('ft').value,
  email:document.getElementById('fe').value,
  endereco:document.getElementById('fend').value,
  convenio:document.getElementById('fconv').value,
  alergias:document.getElementById('falg').value,
  medicamentos:document.getElementById('fmed').value,
  conds:document.getElementById('fconds').value,
  queixa:document.getElementById('fq').value
};}

function saveNP(){
  const f=readForm();if(!f.nome){toast('Nome é obrigatório.','err');return;}
  const p={id:uid(),criadoEm:new Date().toISOString(),...f};
  DB.patients.push(p);save();closeM();toast('Paciente cadastrado!','ok');go('patient',p.id);
}
function saveEP(id){
  const f=readForm();if(!f.nome){toast('Nome é obrigatório.','err');return;}
  const i=DB.patients.findIndex(x=>x.id===id);
  DB.patients[i]={...DB.patients[i],...f};
  save();closeM();toast('Dados atualizados!','ok');render();
}
function delPat(id){
  const p=DB.patients.find(x=>x.id===id);
  if(!confirm(`Excluir "${p.nome}"? Todos os dados serão removidos.`))return;
  ['patients','treatments','payments','evolutions'].forEach(k=>{
    if(k==='patients')DB.patients=DB.patients.filter(x=>x.id!==id);
    else DB[k]=DB[k].filter(x=>x.pid!==id);
  });
  save();toast('Paciente excluído.');go('pacientes');
}

// ── TREATMENT MODAL ───────────────────────────────────
function openNT(){openM('Adicionar Procedimento',`
  <div class="fg">
    <div class="fgr full"><label>Procedimento *</label><input id="tp" placeholder="Ex: Extração, Canal, Implante..."></div>
    <div class="fgr"><label>Número do dente</label><input id="td" placeholder="Ex: 36"></div>
    <div class="fgr"><label>Valor (R$)</label><input id="tv" type="number" min="0" step="0.01" placeholder="0,00"></div>
    <div class="fgr"><label>Status</label><select id="ts"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option><option value="concluido">Concluído</option></select></div>
    <div class="fgr full"><label>Observações</label><textarea id="to" placeholder="Detalhes..."></textarea></div>
  </div>`,'saveNT()');}

function saveNT(){
  const proc=document.getElementById('tp').value.trim();
  if(!proc){toast('Procedimento é obrigatório.','err');return;}
  DB.treatments.push({id:uid(),pid,proc,dente:document.getElementById('td').value,valor:document.getElementById('tv').value||0,status:document.getElementById('ts').value,obs:document.getElementById('to').value,criadoEm:new Date().toISOString()});
  save();closeM();toast('Procedimento adicionado!','ok');setTab('tratamento');
}
function updTreat(id,status){
  const t=DB.treatments.find(x=>x.id===id);if(t){t.status=status;save();}
  document.getElementById('tc').innerHTML=renderTab();
}
function delTreat(id){
  if(!confirm('Remover este procedimento?'))return;
  DB.treatments=DB.treatments.filter(x=>x.id!==id);save();setTab('tratamento');
}

// ── PAYMENT MODAL ─────────────────────────────────────
function openNPy(){openM('Registrar Pagamento',`
  <div class="fg">
    <div class="fgr full"><label>Descrição *</label><input id="pyd" placeholder="Ex: Consulta inicial, Parcela 1..."></div>
    <div class="fgr"><label>Valor (R$) *</label><input id="pyv" type="number" min="0" step="0.01" placeholder="0,00"></div>
    <div class="fgr"><label>Data</label><input id="pyd2" type="date" value="${today()}"></div>
    <div class="fgr full"><label>Forma de pagamento</label>
      <select id="pyf"><option value="pix">PIX</option><option value="dinheiro">Dinheiro</option><option value="cartao_credito">Cartão de Crédito</option><option value="cartao_debito">Cartão de Débito</option><option value="convenio">Convênio</option><option value="cheque">Cheque</option></select>
    </div>
  </div>`,'saveNPy()');}

function saveNPy(){
  const desc=document.getElementById('pyd').value.trim();
  const valor=parseFloat(document.getElementById('pyv').value);
  if(!desc){toast('Descrição é obrigatória.','err');return;}
  if(!valor||valor<=0){toast('Informe um valor válido.','err');return;}
  DB.payments.push({id:uid(),pid,desc,valor,data:document.getElementById('pyd2').value,forma:document.getElementById('pyf').value,criadoEm:new Date().toISOString()});
  save();closeM();toast('Pagamento registrado!','ok');setTab('financeiro');
}
function delPay(id){
  if(!confirm('Remover este pagamento?'))return;
  DB.payments=DB.payments.filter(x=>x.id!==id);save();setTab('financeiro');
}

// ── EVOLUTION MODAL ───────────────────────────────────
function openNE(){openM('Nova Evolução',`
  <div class="fg">
    <div class="fgr full"><label>Procedimento realizado *</label><input id="ep" placeholder="Ex: Limpeza, Restauração..."></div>
    <div class="fgr"><label>Data *</label><input id="ed" type="date" value="${today()}"></div>
    <div class="fgr"><label>Hora</label><input id="eh" type="time"></div>
    <div class="fgr full"><label>Notas / Evolução do caso</label><textarea id="en" placeholder="Queixas, observações clínicas, evolução..." style="min-height:110px"></textarea></div>
    <div class="fgr full"><label>Próxima consulta</label><input id="epr" type="date"></div>
  </div>`,'saveNE()');}

function saveNE(){
  const proc=document.getElementById('ep').value.trim();
  const data=document.getElementById('ed').value;
  if(!proc){toast('Procedimento é obrigatório.','err');return;}
  if(!data){toast('Data é obrigatória.','err');return;}
  DB.evolutions.push({id:uid(),pid,proc,data,hora:document.getElementById('eh').value,notas:document.getElementById('en').value,prox:document.getElementById('epr').value,criadoEm:new Date().toISOString()});
  save();closeM();toast('Evolução registrada!','ok');setTab('evolucoes');
}
function delEvol(id){
  if(!confirm('Remover esta evolução?'))return;
  DB.evolutions=DB.evolutions.filter(x=>x.id!==id);save();setTab('evolucoes');
}

// ── INIT ──────────────────────────────────────────────
load();render();
</script>
</body>
</html>
